# Netlify site: "Lydia's Essence Admin"
# This command works whether Netlify starts the build in the repo root or in apps/admin:
# pnpm finds the workspace root by itself, so no "cd" is needed.
# Leave "Base directory" EMPTY in the Netlify site settings: the build runs from the repo root,
# and the publish path below is relative to the repo root.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @lydias-essence/admin build"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routes (/products, /settings/banner …) must work on refresh and direct links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
